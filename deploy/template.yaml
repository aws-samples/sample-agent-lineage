AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Agent Lineage - end-to-end agent lineage for AgentCore platforms.
  CloudFront (S3 frontend + /api to ALB->Fargate), EFS-backed SQLite,
  Cognito authentication, read-only sync role.

Parameters:
  ImageUri:
    Type: String
    Description: ECR image URI for the backend (pushed by deploy.sh)
  OriginVerifySecret:
    Type: String
    NoEcho: true
    Description: Shared secret CloudFront sends to the ALB (generated by deploy.sh)
  ExistingVpcId:
    Type: String
    Default: ""
    Description: >-
      Optional: reuse an existing VPC (avoids the VPC quota). Leave empty to
      create a dedicated VPC.
  ExistingSubnetIds:
    Type: String
    Default: ""
    Description: >-
      Required when ExistingVpcId is set: two PUBLIC subnet IDs in different
      AZs, comma-separated (e.g. subnet-aaa,subnet-bbb). Must route to an IGW.
  SesSenderEmail:
    Type: String
    Default: ""
    Description: >-
      Optional: SES-verified sender address for access-request notification
      emails to admins. Leave empty to disable email notifications.
  SyncExternalId:
    Type: String
    Description: >-
      Deployment-unique ExternalId for cross-account AssumeRole calls
      (confused-deputy guard). Generated by deploy.sh; spoke role trust
      policies must require this value via an sts:ExternalId condition.
      Never publish this value.
  # NOTE: the ingest API key is intentionally NOT a stack parameter. It lives
  # in SSM Parameter Store (SecureString /agent-lineage/ingest-api-key, created
  # by deploy.sh) and is injected into the task via ECS Secrets/ValueFrom, so
  # it never appears in describe-stacks output or the task definition.
  CloudFrontPrefixListId:
    Type: String
    AllowedPattern: "^pl-[0-9a-f]+$"
    Description: >-
      ID of the AWS-managed prefix list "com.amazonaws.global.cloudfront.origin-facing"
      in this region (deploy.sh resolves it automatically). Locks the ALB so only
      CloudFront edge nodes can reach it. Find it manually with:
      aws ec2 describe-managed-prefix-lists --filters
      Name=prefix-list-name,Values=com.amazonaws.global.cloudfront.origin-facing

Conditions:
  CreateNetwork: !Equals [!Ref ExistingVpcId, ""]

Resources:
  # ---------------- Network (only when no existing VPC is supplied) ----------------
  Vpc:
    Type: AWS::EC2::VPC
    Condition: CreateNetwork
    Properties:
      CidrBlock: 10.20.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags: [{ Key: Name, Value: agent-lineage }]

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Condition: CreateNetwork

  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Condition: CreateNetwork
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Condition: CreateNetwork
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.20.0.0/20
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true

  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Condition: CreateNetwork
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.20.16.0/20
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: true

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Condition: CreateNetwork
    Properties:
      VpcId: !Ref Vpc

  PublicRoute:
    Type: AWS::EC2::Route
    Condition: CreateNetwork
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  SubnetARouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: CreateNetwork
    Properties:
      SubnetId: !Ref PublicSubnetA
      RouteTableId: !Ref PublicRouteTable

  SubnetBRouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: CreateNetwork
    Properties:
      SubnetId: !Ref PublicSubnetB
      RouteTableId: !Ref PublicRouteTable

  # ---------------- Security groups ----------------
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: >-
        ALB - HTTP from CloudFront edge nodes only (managed prefix list),
        plus origin-header verification at the listener.
      VpcId: !If [CreateNetwork, !Ref Vpc, !Ref ExistingVpcId]
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourcePrefixListId: !Ref CloudFrontPrefixListId
          Description: HTTP from CloudFront origin-facing edge nodes only

  TaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Fargate task - traffic from ALB only
      VpcId: !If [CreateNetwork, !Ref Vpc, !Ref ExistingVpcId]
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8000
          ToPort: 8000
          SourceSecurityGroupId: !Ref AlbSecurityGroup
          Description: API traffic from the ALB only

  EfsSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: EFS - NFS from tasks only
      VpcId: !If [CreateNetwork, !Ref Vpc, !Ref ExistingVpcId]
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 2049
          ToPort: 2049
          SourceSecurityGroupId: !Ref TaskSecurityGroup
          Description: NFS from Fargate tasks only

  # ---------------- EFS (SQLite persistence) ----------------
  FileSystem:
    Type: AWS::EFS::FileSystem
    Properties:
      Encrypted: true
      FileSystemTags: [{ Key: Name, Value: agent-lineage-db }]

  MountTargetA:
    Type: AWS::EFS::MountTarget
    Properties:
      FileSystemId: !Ref FileSystem
      SubnetId: !If
        - CreateNetwork
        - !Ref PublicSubnetA
        - !Select [0, !Split [",", !Ref ExistingSubnetIds]]
      SecurityGroups: [!Ref EfsSecurityGroup]

  MountTargetB:
    Type: AWS::EFS::MountTarget
    Properties:
      FileSystemId: !Ref FileSystem
      SubnetId: !If
        - CreateNetwork
        - !Ref PublicSubnetB
        - !Select [1, !Split [",", !Ref ExistingSubnetIds]]
      SecurityGroups: [!Ref EfsSecurityGroup]

  DataAccessPoint:
    Type: AWS::EFS::AccessPoint
    Properties:
      FileSystemId: !Ref FileSystem
      PosixUser: { Uid: "0", Gid: "0" }
      RootDirectory:
        Path: /data
        CreationInfo: { OwnerUid: "0", OwnerGid: "0", Permissions: "750" }

  # ---------------- ECS / Fargate ----------------
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: agent-lineage
      ClusterSettings:
        - Name: containerInsights
          Value: enabled

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /ecs/agent-lineage
      RetentionInDays: 30

  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: read-ingest-key
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ReadIngestKeyParameter
                Effect: Allow
                Action: ssm:GetParameters
                Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/agent-lineage/ingest-api-key"

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: agent-lineage-readonly-sync
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: lineage-readonly-sync
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: AgentCoreRead
                Effect: Allow
                Action:
                  - bedrock-agentcore:List*
                  - bedrock-agentcore:Get*
                  - bedrock:ListGuardrails
                  - bedrock:GetGuardrail
                  - logs:FilterLogEvents
                  - logs:DescribeLogGroups
                Resource: "*"
              # RBAC: read roles/attributes, write namespace grants on approval.
              - Sid: CognitoRbac
                Effect: Allow
                Action:
                  - cognito-idp:AdminGetUser
                  - cognito-idp:ListUsersInGroup
                  - cognito-idp:AdminUpdateUserAttributes
                Resource: !GetAtt UserPool.Arn
              # Access-request notification emails to admins (no-op when
              # SesSenderEmail is empty). Scoped to this account's verified
              # SES identities in the stack region.
              - Sid: AccessRequestNotify
                Effect: Allow
                Action: ses:SendEmail
                Resource: !Sub "arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/*"
              # ECS Exec: lets an operator run one-off commands inside the
              # task (e.g. `python -m app.seed` to load the demo dataset onto
              # the EFS-backed database). The SSM channel is the only thing
              # granted; who may *call* execute-command is governed by the
              # operator's own IAM identity, not this role.
              - Sid: EcsExecChannel
                Effect: Allow
                Action:
                  - ssmmessages:CreateControlChannel
                  - ssmmessages:CreateDataChannel
                  - ssmmessages:OpenControlChannel
                  - ssmmessages:OpenDataChannel
                Resource: "*"

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: agent-lineage
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: "512"
      Memory: "1024"
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      Volumes:
        - Name: data
          EFSVolumeConfiguration:
            FilesystemId: !Ref FileSystem
            TransitEncryption: ENABLED
            AuthorizationConfig:
              AccessPointId: !Ref DataAccessPoint
      ContainerDefinitions:
        - Name: api
          Image: !Ref ImageUri
          PortMappings: [{ ContainerPort: 8000, Protocol: tcp }]
          MountPoints: [{ SourceVolume: data, ContainerPath: /mnt/data }]
          Environment:
            - { Name: AGENT_LINEAGE_DB, Value: "sqlite:////mnt/data/agent_lineage.db" }
            - { Name: COGNITO_USER_POOL_ID, Value: !Ref UserPool }
            - { Name: COGNITO_CLIENT_ID, Value: !Ref UserPoolClient }
            - { Name: COGNITO_REGION, Value: !Ref "AWS::Region" }
            - { Name: COGNITO_DOMAIN, Value: !Sub "agent-lineage-${AWS::AccountId}.auth.${AWS::Region}.amazoncognito.com" }
            - { Name: ADMIN_GROUP, Value: admin }
            - { Name: SES_SENDER, Value: !Ref SesSenderEmail }
            - { Name: SYNC_EXTERNAL_ID, Value: !Ref SyncExternalId }
          Secrets:
            # Ingestion service credential, resolved at task start from SSM
            # SecureString -- never stored in the task definition.
            - Name: INGEST_API_KEY
              ValueFrom: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/agent-lineage/ingest-api-key"
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref "AWS::Region"
              awslogs-stream-prefix: api

  Service:
    Type: AWS::ECS::Service
    DependsOn: [HttpListener, MountTargetA, MountTargetB]
    Properties:
      ServiceName: agent-lineage
      Cluster: !Ref Cluster
      LaunchType: FARGATE
      DesiredCount: 1
      EnableExecuteCommand: true
      TaskDefinition: !Ref TaskDefinition
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: !If
            - CreateNetwork
            - [!Ref PublicSubnetA, !Ref PublicSubnetB]
            - !Split [",", !Ref ExistingSubnetIds]
          SecurityGroups: [!Ref TaskSecurityGroup]
      LoadBalancers:
        - ContainerName: api
          ContainerPort: 8000
          TargetGroupArn: !Ref TargetGroup

  # ---------------- ALB (locked to CloudFront via header) ----------------
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: agent-lineage
      Scheme: internet-facing
      Type: application
      LoadBalancerAttributes:
        # Reject requests with malformed headers (header-smuggling defense).
        - Key: routing.http.drop_invalid_header_fields.enabled
          Value: "true"
      Subnets: !If
        - CreateNetwork
        - [!Ref PublicSubnetA, !Ref PublicSubnetB]
        - !Split [",", !Ref ExistingSubnetIds]
      SecurityGroups: [!Ref AlbSecurityGroup]

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !If [CreateNetwork, !Ref Vpc, !Ref ExistingVpcId]
      Port: 8000
      Protocol: HTTP
      TargetType: ip
      HealthCheckPath: /api/v1/health
      HealthCheckIntervalSeconds: 30
      Matcher: { HttpCode: "200" }

  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: fixed-response
          FixedResponseConfig:
            StatusCode: "403"
            ContentType: text/plain
            MessageBody: Forbidden

  OriginVerifyRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref HttpListener
      Priority: 1
      Conditions:
        - Field: http-header
          HttpHeaderConfig:
            HttpHeaderName: X-Origin-Verify
            Values: [!Ref OriginVerifySecret]
      Actions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  # ---------------- Frontend: S3 + CloudFront ----------------
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "agent-lineage-oac-${AWS::AccountId}"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: Agent Lineage
        DefaultRootObject: index.html
        HttpVersion: http2
        Origins:
          - Id: frontend-s3
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !Ref OriginAccessControl
            S3OriginConfig: { OriginAccessIdentity: "" }
          - Id: api-alb
            DomainName: !GetAtt LoadBalancer.DNSName
            CustomOriginConfig:
              HTTPPort: 80
              OriginProtocolPolicy: http-only
            OriginCustomHeaders:
              - HeaderName: X-Origin-Verify
                HeaderValue: !Ref OriginVerifySecret
        DefaultCacheBehavior:
          TargetOriginId: frontend-s3
          ViewerProtocolPolicy: redirect-to-https
          # Managed policy: CachingOptimized
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
        CacheBehaviors:
          - PathPattern: "/api/*"
            TargetOriginId: api-alb
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            # Managed policies: CachingDisabled + AllViewerExceptHostHeader
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
        CustomErrorResponses:
          # SPA routing: unknown paths serve the app shell.
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
        ViewerCertificate:
          CloudFrontDefaultCertificate: true

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub "${FrontendBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

  # ---------------- Cognito ----------------
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: agent-lineage
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
      # TOTP MFA, optional first so existing users can enroll without lockout;
      # switch to "ON" once all users are enrolled (F13).
      MfaConfiguration: OPTIONAL
      EnabledMfas: [SOFTWARE_TOKEN_MFA]
      Schema:
        # Comma-separated account grants for viewers ("123456789012" grants
        # all regions; "123456789012/us-east-1" grants one namespace).
        - Name: allowed_namespaces
          AttributeDataType: String
          Mutable: true
          StringAttributeConstraints: { MinLength: "0", MaxLength: "2048" }

  AdminGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      UserPoolId: !Ref UserPool
      GroupName: admin
      Description: Full access - manage syncs, namespaces, and access requests

  ViewerGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      UserPoolId: !Ref UserPool
      GroupName: viewer
      Description: Read-only access, scoped by custom:allowed_namespaces

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      UserPoolId: !Ref UserPool
      Domain: !Sub "agent-lineage-${AWS::AccountId}"

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: agent-lineage-web
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email]
      SupportedIdentityProviders: [COGNITO]
      CallbackURLs:
        - !Sub "https://${Distribution.DomainName}/"
        - http://localhost:5173/
      LogoutURLs:
        - !Sub "https://${Distribution.DomainName}/"
        - http://localhost:5173/
      # 1h tokens shrink the stolen-token window (F3 interim); Cognito's own
      # session cookie makes hourly re-auth a silent redirect, not a login.
      AccessTokenValidity: 1
      IdTokenValidity: 1
      TokenValidityUnits: { AccessToken: hours, IdToken: hours }

Outputs:
  AppUrl:
    Value: !Sub "https://${Distribution.DomainName}"
  DistributionId:
    Value: !Ref Distribution
  FrontendBucket:
    Value: !Ref FrontendBucket
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  CreateUserHint:
    Value: !Sub >-
      aws cognito-idp admin-create-user --user-pool-id ${UserPool}
      --username you@example.com --user-attributes Name=email,Value=you@example.com
      Name=email_verified,Value=true --region ${AWS::Region}
  AssignRoleHint:
    Value: !Sub >-
      aws cognito-idp admin-add-user-to-group --user-pool-id ${UserPool}
      --username you@example.com --group-name admin --region ${AWS::Region}
      (use group-name viewer for read-only users)
