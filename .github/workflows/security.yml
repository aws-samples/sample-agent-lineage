# Security gates -- GitHub Actions mirror of .gitlab-ci.yml.
# Dormant on GitLab; activates automatically when this repo is
# hosted on GitHub. Both pipelines call the same scripts in ci/ so the gating
# logic lives in exactly one place.
#
# Setup on GitHub (for the IAM Access Analyzer job only):
#   1. Create an IAM role trusted by GitHub's OIDC provider
#      (token.actions.githubusercontent.com) with access-analyzer:ValidatePolicy.
#   2. Set repo variable AWS_CI_ROLE_ARN to that role's ARN.
#   The ASH job needs no setup at all.

name: security

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write # OIDC for the IAM Access Analyzer job

jobs:
  ash-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # Pinned ASH version for reproducible gating.
      - name: Install ASH
        run: pip install --quiet "git+https://github.com/awslabs/automated-security-helper.git@v3.5.8"
      # ASH's own exit code is replaced by the allowlist-aware gate below.
      - name: Run ASH scan
        run: ash --mode local --source-dir . --output-dir .ash-ci || true
      - name: Gate on unreviewed MEDIUM+ findings
        run: python ci/check_ash_findings.py .ash-ci/reports/ash.flat.json .security/ash-allowlist.json
      - name: Upload scan reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ash-reports
          path: .ash-ci/reports/
          retention-days: 30

  iam-policy-validation:
    runs-on: ubuntu-latest
    # Only when the template changed (checked in-job) and OIDC role configured.
    if: vars.AWS_CI_ROLE_ARN != ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: Check whether deploy/template.yaml changed
        id: changed
        run: |
          if git diff --name-only HEAD^ HEAD 2>/dev/null | grep -q '^deploy/template.yaml$' \
             || [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: steps.changed.outputs.run == 'true'
        with:
          python-version: "3.12"
      - name: Configure AWS credentials (OIDC)
        if: steps.changed.outputs.run == 'true'
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_CI_ROLE_ARN }}
          aws-region: us-east-1
      - name: Extract and validate IAM policies
        if: steps.changed.outputs.run == 'true'
        run: |
          pip install --quiet pyyaml
          python ci/extract_iam_policies.py deploy/template.yaml /tmp/iam-policies
          fail=0
          gate() {
            f="$1"; shift
            echo "== Validating ${f}"
            out=$(aws accessanalyzer validate-policy --policy-document "file://${f}" "$@") || { echo "validate-policy call failed"; fail=1; return; }
            echo "$out"
            blocked=$(echo "$out" | python -c "import json,sys; f=json.load(sys.stdin)['findings']; print(sum(1 for x in f if x['findingType'] in ('ERROR','SECURITY_WARNING')))")
            [ "$blocked" != "0" ] && { echo "BLOCKING findings in ${f}"; fail=1; }
          }
          for f in /tmp/iam-policies/identity-*.json; do
            [ -e "$f" ] && gate "$f" --policy-type IDENTITY_POLICY
          done
          for f in /tmp/iam-policies/trust-*.json; do
            [ -e "$f" ] && gate "$f" --policy-type RESOURCE_POLICY --validate-policy-resource-type AWS::IAM::AssumeRolePolicyDocument
          done
          exit $fail
